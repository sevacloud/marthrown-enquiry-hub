name: Deploy to Production

# Merges to main (a manual action) deploy into the live plugin folder on the
# WordPress site (IONOS) via SFTP, so the team can test before going live.
# Kept separate from staging on purpose.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main -> live plugin folder
    runs-on: ubuntu-latest
    # Requires a "production" environment; add required reviewers in GitHub
    # settings to keep this as a manual, approved step.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Validate PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Deploy via SFTP (lftp mirror)
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USER }}
          pass: ${{ secrets.SFTP_PASS }}
          localDir: .
          # Target the live plugin directory.
          remoteDir: ${{ secrets.SFTP_REMOTE_DIR }}/marthrown-enquiry-hub
          reverse: true
          restoreMTime: true
          # Skip repo/dev files (see .lftp_ignore).
          ignoreFile: .lftp_ignore
          parallel: 3
