name: Deploy to Staging

# Pushes to the develop branch deploy into a "-staging" plugin folder on the
# WordPress site so changes can be tested in isolation from live.

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy develop -> staging folder
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Validate PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Write staging environment marker
        # The plugin loads this file if present and defines MEH_ENVIRONMENT so
        # staging detection is explicit rather than relying on the folder name.
        run: |
          cat > meh-environment.php <<'PHP'
          <?php
          // Generated by CI for the staging deploy. Do not commit.
          if ( ! defined( 'MEH_ENVIRONMENT' ) ) {
          	define( 'MEH_ENVIRONMENT', 'staging' );
          }
          PHP

      - name: Deploy via SSH/rsync to staging folder
        uses: burnett01/rsync-deployments@7.0.2
        with:
          # Exclude repo/dev files; deploy plugin source only.
          switches: -avzr --delete --exclude='.git*' --exclude='.github' --exclude='node_modules'
          path: ./
          # Target the "-staging" plugin directory.
          remote_path: ${{ secrets.WP_PLUGINS_PATH }}/marthrown-enquiry-hub-staging/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
