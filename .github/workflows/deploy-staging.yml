name: Deploy to Staging

# Pushes to the develop branch deploy into a "-staging" plugin folder on the
# WordPress site (IONOS) via SFTP, so changes can be tested in isolation from
# live. Uses the same lftp-mirror approach proven on property-portal-core.

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy develop -> staging folder
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Validate PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Write staging environment marker
        # The plugin loads this file if present and defines MEH_ENVIRONMENT so
        # staging detection is explicit rather than relying on the folder name.
        run: |
          cat > meh-environment.php <<'PHP'
          <?php
          // Generated by CI for the staging deploy. Do not commit.
          if ( ! defined( 'MEH_ENVIRONMENT' ) ) {
          	define( 'MEH_ENVIRONMENT', 'staging' );
          }
          PHP

      - name: Deploy via SFTP (lftp mirror)
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USER }}
          pass: ${{ secrets.SFTP_PASS }}
          localDir: .
          # Target the "-staging" plugin directory.
          remoteDir: ${{ secrets.SFTP_REMOTE_DIR }}/marthrown-enquiry-hub-staging
          reverse: true
          restoreMTime: true
          # Skip repo/dev files (see .lftp_ignore).
          ignoreFile: .lftp_ignore
          parallel: 3
